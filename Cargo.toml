[workspace]
resolver = "2"
members = [
    "crates/diavolo-format",
    "crates/diavolo-index",
    "crates/diavolo-ext4",
    "crates/diavolo-fuse",
    "crates/diavolo-cli",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HomerSlated/diavolo"
publish = false
